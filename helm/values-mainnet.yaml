# Mainnet environment values for stats-backend

clusterName: stats-service-cluster
namespace: stats-backend-production
envSuffix: mainnet

image:
  tag: testnet

env:
  nodeEnv: mainnet

# Connect to external ALB via TargetGroupBinding
targetGroupBinding:
  enabled: true
  targetGroupArn: "arn:aws:elasticloadbalancing:us-east-2:654654249872:targetgroup/stats-service-cluster-mainnet/b63b636e08e5ebdf"
  targetType: instance

externalSecrets:
  enabled: true
  refreshInterval: 1h
  secretStoreName: "stats-backend-production-secret-store"
  # targetSecretName defaults to stats-backend-mainnet-secrets (matches deployment)
  secrets:
    - secretKey: backend-password
      remoteKey: /stats-service-cluster/stats-backend-production/database-password-mainnet
