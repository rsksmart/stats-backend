{{- if and .Values.targetGroupBinding .Values.targetGroupBinding.enabled }}
apiVersion: elbv2.k8s.aws/v1beta1
kind: TargetGroupBinding
metadata:
  name: {{ include "app.fullname" . }}
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "app.labels" . | nindent 4 }}
spec:
  serviceRef:
    name: {{ include "app.fullname" . }}
    port: {{ .Values.service.port }}
  targetGroupARN: {{ .Values.targetGroupBinding.targetGroupArn }}
  {{- if .Values.targetGroupBinding.targetType }}
  targetType: {{ .Values.targetGroupBinding.targetType }}
  {{- end }}
{{- end }}
