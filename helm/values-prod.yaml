# Production environment values for stats-backend

replicaCount: 3

namespace: stats-backend-prod

image:
  tag: latest

env:
  nodeEnv: production

# Connect to external ALB via TargetGroupBinding
targetGroupBinding:
  enabled: true
  targetGroupArn: ""  # Add production target group ARN
  targetType: instance

resources:
  requests:
    cpu: 200m
    memory: 512Mi
  limits:
    cpu: 1000m
    memory: 1Gi

externalSecrets:
  enabled: true
  envSuffix: prod
